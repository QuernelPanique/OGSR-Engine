name: Main Workflow

on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Полная Release-сборка (LTCG, с нуля, без кэша сборки)'
        type: boolean
        default: false
  push:
  pull_request:
  release:
    types:
      - created

# OP22: быстрая сборка для прототипа - кэш сторонних библиотек и промежуточных файлов, время файлов из git,
# без LTCG (WholeProgramOptimization=false). Полная - ручной запуск с full=true или релиз.
env:
  OP22_FULL: ${{ github.event_name == 'release' || inputs.full == true }}

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
#        Configuration: [Debug, Release, ReleaseTracyProfiler]
        Configuration: [Release]   # OP22: только Release (Tracy - 12.11 исключён решением пользователя; вернуть - добавить ReleaseTracyProfiler)
        Platform: [x64]
        include:
#          - Configuration: Debug
#            ConfigurationReal: Debug
          - Configuration: Release
            ConfigurationReal: Release
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Restore file mtimes from git (incremental build)
      shell: python
      run: |
        import os, subprocess
        out = subprocess.run(['git', '-c', 'core.quotepath=off', 'log', '--format=%x00%ct', '--name-only', '--no-renames'],
                             capture_output=True, text=True, encoding='utf-8', errors='replace').stdout
        seen, t = set(), None
        for line in out.splitlines():
            if line.startswith('\x00'):
                t = int(line[1:])
                continue
            if not line or line in seen or t is None:
                continue
            seen.add(line)
            if os.path.isfile(line):
                os.utime(line, (t, t))
        print('files:', len(seen))

    - name: Cache components
      id: deps
      uses: actions/cache@v6.1.0
      with:
        path: |
          3rd_party/Src/DirectXTex/DirectXTex
          3rd_party/Src/DirectXMesh/DirectXMesh
          3rd_party/Src/DirectXMath/DirectXMath
          3rd_party/Src/concurrentqueue/concurrentqueue
          3rd_party/Src/libsquashfs/squashfs-tools-ng
          3rd_party/Src/lz4/lz4
          3rd_party/Src/zstd/zstd
          3rd_party/Src/mimalloc/mimalloc
          3rd_party/Src/NVIDIA_DLSS/DLSS
          3rd_party/Src/cpputils/cpputils
          3rd_party/Src/DiscordRPC/DiscordRPC
          3rd_party/Src/FidelityFX-SDK/FidelityFX-SDK
        key: deps-${{ hashFiles('Update_Components.cmd') }}

    - name: Update Components
      if: steps.deps.outputs.cache-hit != 'true'
      run: |
        ${{ github.workspace }}/Update_Components.cmd

    - name: Cache build
      if: env.OP22_FULL != 'true'
      uses: actions/cache@v6.1.0
      with:
        path: |
          ogsr_engine/_TEMP
          ogsr_engine/_LIB
          3rd_party/_TEMP
          3rd_party/_LIB
          bin_x64
        # OP22: кэш у каждой конфигурации свой - TRACY_ENABLE меняет код, объекты смешивать нельзя
        key: build-fast-${{ matrix.Platform }}-${{ matrix.Configuration }}-${{ github.sha }}
        restore-keys: build-fast-${{ matrix.Platform }}-${{ matrix.Configuration }}-

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: MSBuild
      shell: cmd
      run: |
        set APPVEYOR_BUILD_VERSION=3.${{ github.run_number }}
        set APPVEYOR_REPO_NAME=${{ github.repository }}
        set CONFIGURATION_GA=${{ matrix.Configuration }}
        
        if "%OP22_FULL%"=="true" (
          msbuild Engine.sln /m /t:Rebuild /p:Configuration=${{ matrix.ConfigurationReal }} /p:Platform=${{ matrix.Platform }}
        ) else (
          msbuild Engine.sln /m /t:Build /p:Configuration=${{ matrix.ConfigurationReal }} /p:Platform=${{ matrix.Platform }} /p:WholeProgramOptimization=false
        )
    - name: Prepare artifacts
      shell: cmd
      run: |
        set APPVEYOR_BUILD_VERSION=3.${{ github.run_number }}
        set CONFIGURATION=${{ matrix.Configuration }}
        set PLATFORM=${{ matrix.Platform }}
        set OGSR_ARTIFACT_NAME=OGSR_Engine_SHOC_EDITION_%PLATFORM%_%APPVEYOR_BUILD_VERSION%_%CONFIGURATION%.7z
        cd bin_%PLATFORM%
        
        md ..\Game\Resources_SoC_1.0006\bin_%PLATFORM%
        
        copy *.* ..\Game\Resources_SoC_1.0006\bin_%PLATFORM%
        
        cd ..\Game\Resources_SoC_1.0006
        
        if "%OP22_FULL%"=="true" (
          7z a -t7z -m0=LZMA2:d=96m:fb=273 -mx=9 -mmt=2 ..\..\%OGSR_ARTIFACT_NAME% .\
        ) else (
          7z a -t7z -mx=1 -mmt=on ..\..\%OGSR_ARTIFACT_NAME% .\
        )
    - name: Upload OGSR artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: OGSR_Engine_SHOC_EDITION_${{ matrix.Platform }}_3.${{ github.run_number }}_${{ matrix.Configuration }}.7z
        path: .\OGSR_Engine_SHOC_EDITION_${{ matrix.Platform }}_3.${{ github.run_number }}_${{ matrix.Configuration }}.7z
        archive: false

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: shogo82148/actions-upload-release-asset@v1.10.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: .\OGSR_Engine_SHOC_EDITION_${{ matrix.Platform }}_3.${{ github.run_number }}_${{ matrix.Configuration }}.7z
        asset_name: OGSR_Engine_SHOC_EDITION_${{ matrix.Platform }}_3.${{ github.run_number }}_${{ matrix.Configuration }}.7z
        asset_content_type: application/x-7z-compressed
